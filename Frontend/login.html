<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход администратора — CineMax</title><link rel="stylesheet" href="css/style.css"><body><main style="max-width:420px;margin:12vh auto;padding:24px"><h1>CineMax</h1><h2>Вход администратора</h2><form id="adminLogin"><p><label>Email <input class="form-control" type="email" id="email" autocomplete="username" required></label></p><p><label>Пароль <input class="form-control" type="password" id="password" autocomplete="current-password" required></label></p><button class="btn-red" id="submit">Войти</button><p id="error" role="alert"></p></form><a href="index.html">На главную</a></main><script src="js/config.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script src="js/supabase-api.js"></script>
<script src="js/api.js"></script><script>document.getElementById('adminLogin').addEventListener('submit',async e=>{e.preventDefault();document.getElementById('submit').disabled=true;try{const user=await api.post('/auth/login',{email:document.getElementById('email').value,password:document.getElementById('password').value});if(user.role!=='Admin')throw new Error('Для этого аккаунта нет прав администратора.');localStorage.setItem('cinemax_user',JSON.stringify(user));localStorage.setItem('cinemax_admin','true');location.href='admin.html';}catch(e){document.getElementById('error').textContent=e.message;}finally{document.getElementById('submit').disabled=false;}});</script></body></html>
