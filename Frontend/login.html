<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-primary); }
    .login-card { background:var(--bg-secondary); border-radius:16px; padding:48px 40px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
    .login-logo { font-size:28px; font-weight:900; letter-spacing:2px; text-align:center; margin-bottom:8px; }
    .login-logo span { color:var(--accent); }
    .login-subtitle { text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:32px; }
    .login-input { background:var(--bg-primary); border:1px solid var(--border); color:var(--text-primary); border-radius:10px; padding:12px 16px; width:100%; font-size:15px; transition:border-color .2s; }
    .login-input:focus { outline:none; border-color:var(--accent); }
    .login-label { font-size:13px; color:var(--text-secondary); margin-bottom:6px; display:block; }
    .login-error { background:rgba(229,9,20,0.1); border:1px solid rgba(229,9,20,0.3); border-radius:8px; padding:10px 14px; font-size:13px; color:#ff6b6b; display:none; margin-bottom:16px; }
    .login-hint { text-align:center; font-size:12px; color:var(--text-muted); margin-top:16px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">CINE<span>MAX</span></div>
    <div class="login-subtitle"><i class="bi bi-shield-lock me-1"></i>Admin Panel Access</div>

    <div class="login-error" id="loginError"><i class="bi bi-exclamation-circle me-1"></i>Invalid username or password</div>

    <form onsubmit="doLogin(event)">
      <div class="mb-4">
        <label class="login-label">Username</label>
        <input type="text" id="username" class="login-input" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="mb-4">
        <label class="login-label">Password</label>
        <div style="position:relative;">
          <input type="password" id="password" class="login-input" placeholder="Enter password" autocomplete="current-password" required style="padding-right:44px;">
          <button type="button" onclick="togglePass()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-red w-100 py-3" style="font-size:15px;font-weight:600;">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login to Admin Panel
      </button>
    </form>

    <div class="login-hint">Default: <strong>admin</strong> / <strong>admin123</strong></div>
    <div class="text-center mt-3"><a href="index.html" style="color:var(--text-muted);font-size:13px;"><i class="bi bi-arrow-left me-1"></i>Back to site</a></div>
  </div>

  <script>
    const ADMIN_CREDS = { admin: 'admin123', superadmin: 'cinemax2024' };

    if (localStorage.getItem('cinemax_admin')) window.location.href = 'admin.html';

    function doLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (ADMIN_CREDS[u] === p) {
        localStorage.setItem('cinemax_admin', btoa(u + ':' + Date.now()));
        window.location.href = 'admin.html';
      } else {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('password').value = '';
      }
    }

    function togglePass() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') { inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
    }
  </script>
</body>
</html>
