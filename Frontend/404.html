<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:24px; }
    .err-code { font-size:clamp(80px,20vw,160px); font-weight:900; line-height:1; background:linear-gradient(135deg,#e50914,#b20710); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .err-icon { font-size:64px; margin-bottom:16px; display:block; }
    .err-title { font-size:28px; font-weight:700; color:var(--text-primary); margin-bottom:12px; }
    .err-text { color:var(--text-muted); font-size:16px; max-width:400px; margin-bottom:32px; }
    .err-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    .btn-outline-custom { background:none; border:1px solid var(--border); border-radius:50px; padding:10px 24px; color:var(--text-secondary); font-size:14px; cursor:pointer; text-decoration:none; transition:all .2s; }
    .btn-outline-custom:hover { border-color:var(--accent); color:#fff; }
    .film-strip { display:flex; gap:8px; margin-bottom:32px; opacity:0.2; font-size:28px; }
  </style>
</head>
<body>
  <div class="film-strip">🎬🎬🎬🎬🎬</div>
  <div class="err-code">404</div>
  <div class="err-title">Scene Not Found</div>
  <p class="err-text">Looks like this page went missing from our film library. Maybe it was cut in editing?</p>
  <div class="err-actions">
    <a href="index.html" class="btn-red px-4 py-2"><i class="bi bi-house me-2"></i>Go Home</a>
    <a href="javascript:history.back()" class="btn-outline-custom"><i class="bi bi-arrow-left me-2"></i>Go Back</a>
    <a href="actors.html" class="btn-outline-custom"><i class="bi bi-people me-2"></i>Actors</a>
  </div>

  <script>
    if (localStorage.getItem('cinemax_theme') === 'light') document.body.classList.add('light-mode');
  </script>
</body>
</html>
