<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый пароль — CineMax</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link href="css/features.css" rel="stylesheet">
</head>
<body><main style="max-width:440px;margin:12vh auto;padding:24px">
<a href="index.html">← CineMax</a><h1>Новый пароль</h1>
<p>Откройте эту страницу по ссылке из письма восстановления.</p>
<form id="resetForm">
<p><label for="password">Новый пароль</label><input class="form-control form-control-dark" id="password" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></p>
<p><label for="confirm">Повторите пароль</label><input class="form-control form-control-dark" id="confirm" type="password" autocomplete="new-password" required></p>
<button class="btn-red" id="save">Сохранить пароль</button><p id="message" role="status"></p>
</form><a href="auth.html">Вернуться ко входу</a></main>
<script src="js/config.js"></script><script src="vendor/supabase-2.117.3.js"></script><script src="js/supabase-api.js"></script><script src="js/api.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit', async event => {
  event.preventDefault();
  const message = document.getElementById('message');
  const button = document.getElementById('save');
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('confirm').value) { message.textContent = 'Пароли не совпадают.'; return; }
  button.disabled = true;
  try {
    if (!await supabaseApi.hasSession()) throw new Error('Ссылка истекла. Запросите новое письмо на странице входа.');
    await api.post('/auth/password-update', { password });
    await api.post('/auth/logout', {});
    localStorage.removeItem('cinemax_user'); localStorage.removeItem('cinemax_admin');
    event.target.reset(); message.textContent = 'Пароль обновлён. Теперь войдите с новым паролем.';
  } catch (error) { message.textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
