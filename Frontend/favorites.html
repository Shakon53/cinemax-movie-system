<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites — CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-0">
      <a class="navbar-brand" href="index.html">CINE<span>MAX</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-4 me-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="actors.html"><i class="bi bi-people me-1"></i>Actors</a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html"><i class="bi bi-chat-square-text me-1"></i>Reviews</a></li>
          <li class="nav-item"><a class="nav-link active" href="favorites.html"><i class="bi bi-heart-fill me-1 text-danger"></i>Favorites</a></li>
        </ul>
        <button class="theme-toggle ms-2" onclick="toggleTheme()"><i class="bi bi-sun" id="themeIcon"></i> <span id="themeLabel">Light</span></button>
      </div>
    </div>
  </nav>

  <section class="movies-section">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="section-title mb-0">❤️ My Favorites</h2>
      <button class="btn-red px-3 py-2" onclick="clearAll()" style="font-size:13px;"><i class="bi bi-trash me-1"></i>Clear All</button>
    </div>
    <div id="favGrid" class="movies-grid"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    function getFavs() { return JSON.parse(localStorage.getItem('cinemax_favs') || '[]'); }

    async function loadFavs() {
      const grid = document.getElementById('favGrid');
      const ids = getFavs();
      if (!ids.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="bi bi-heart"></i><h3>No favorites yet</h3><p>Click ❤️ on any movie to add it here</p><a href="index.html" class="btn-red px-4 py-2 mt-3">Browse Movies</a></div>';
        return;
      }
      grid.innerHTML = Array(ids.length).fill(`<div class="skeleton-card"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-line medium"></div></div>`).join('');
      try {
        const movies = await Promise.all(ids.map(id => api.get(`/movies/${id}`).catch(() => null)));
        grid.innerHTML = movies.filter(Boolean).map(m => `
          <div class="movie-card" onclick="window.location='movie.html?id=${m.movieID}'">
            <button class="btn-fav active" onclick="event.stopPropagation();removeFav(${m.movieID},this)" title="Remove">❤️</button>
            ${m.posterUrl ? `<img class="movie-poster" src="${m.posterUrl}" alt="${m.title}" loading="lazy">` : '<div class="movie-poster-placeholder">🎬</div>'}
            <div class="movie-info">
              <div class="movie-title">${m.title}</div>
              <div class="movie-meta"><span class="movie-year">${m.releaseYear}</span><span class="movie-genre">${m.genreName}</span></div>
              <span class="movie-rating"><i class="bi bi-star-fill"></i> ${m.rating.toFixed(1)}</span>
              <a href="movie.html?id=${m.movieID}" class="btn-details">View Details</a>
            </div>
          </div>`).join('');
      } catch(e) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Failed to load</h3></div>'; }
    }

    function removeFav(id) {
      let favs = getFavs().filter(f => f !== id);
      localStorage.setItem('cinemax_favs', JSON.stringify(favs));
      loadFavs();
    }

    function clearAll() {
      localStorage.removeItem('cinemax_favs');
      loadFavs();
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('cinemax_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeIcon').className = isLight ? 'bi bi-moon' : 'bi bi-sun';
      document.getElementById('themeLabel').textContent = isLight ? 'Dark' : 'Light';
    }
    if (localStorage.getItem('cinemax_theme') === 'light') {
      document.body.classList.add('light-mode');
      document.getElementById('themeIcon').className = 'bi bi-moon';
      document.getElementById('themeLabel').textContent = 'Dark';
    }

    loadFavs();
  </script>
<script src="js/keepalive.js"></script></body>
</html>
