<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
<link href="css/features.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-0">
      <a class="navbar-brand" href="index.html">CINE<span>MAX</span></a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Открыть меню"><i class="bi bi-list" style="color:var(--text-primary);font-size:24px"></i></button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav ms-4 me-auto gap-1">
<li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-journal me-1"></i>Мой дневник</a></li>
<li class="nav-item"><a class="nav-link" href="match.html"><i class="bi bi-people-fill me-1"></i>Выбрать с друзьями</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i><span data-i18n="nav_home">Home</span></a></li>
          <li class="nav-item"><a class="nav-link" href="actors.html"><i class="bi bi-people me-1"></i><span data-i18n="nav_actors">Actors</span></a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html"><i class="bi bi-chat-square-text me-1"></i><span data-i18n="nav_reviews">Reviews</span></a></li>

        </ul>
        <div class="d-flex align-items-center gap-2">
          <div id="userNavArea"></div>
          <div class="lang-switcher" id="langSwitcher"></div>

        </div>
      </div>
    </div>

  <section class="movies-section">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="section-title mb-0">❤️ My Favorites</h2>
      <button class="btn-red px-3 py-2" onclick="clearAll()" style="font-size:13px;"><i class="bi bi-trash me-1"></i>Clear All</button>
    </div>
    <div id="favGrid" class="movies-grid"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script src="js/supabase-api.js"></script>
<script src="js/api.js"></script>
  <script src="js/auth-helper.js"></script>
<script src="js/favorites.js"></script>
  <script>
    function getFavs() { return CineMaxFavorites.list(); }

    async function loadFavs() {
      const grid = document.getElementById('favGrid');
      let ids;
      try { ids = await CineMaxFavorites.initialize(); } catch(error) { grid.textContent = error.message; return; }
      if (!ids.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="bi bi-heart"></i><h3>No favorites yet</h3><p>Click ❤️ on any movie to add it here</p><a href="index.html" class="btn-red px-4 py-2 mt-3">Browse Movies</a></div>';
        return;
      }
      grid.innerHTML = Array(ids.length).fill(`<div class="skeleton-card"><div class="skeleton skeleton-poster"></div><div class="skeleton skeleton-line medium"></div></div>`).join('');
      try {
        const movies = await Promise.all(ids.map(id => api.get(`/movies/${id}`).catch(() => null)));
        if (!movies.some(Boolean)) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><h3>Не удалось загрузить избранные фильмы</h3><p>Проверьте соединение и обновите страницу. Фильмы также могли быть сняты с публикации.</p></div>'; return; }
        grid.innerHTML = movies.filter(Boolean).map(m => `
          <div class="movie-card" onclick="window.location='movie.html?id=${m.movieID}'">
            <button class="btn-fav active" onclick="event.stopPropagation();removeFav(${m.movieID},this)" title="Remove">❤️</button>
            ${m.posterUrl ? `<img class="movie-poster" src="${escapeHtml(safeUrl(m.posterUrl))}" alt="${escapeHtml(m.title)}" loading="lazy">` : '<div class="movie-poster-placeholder">🎬</div>'}
            <div class="movie-info">
              <div class="movie-title">${escapeHtml(m.title)}</div>
              <div class="movie-meta"><span class="movie-year">${m.releaseYear}</span><span class="movie-genre">${escapeHtml(m.genreName)}</span></div>
              <span class="movie-rating"><i class="bi bi-star-fill"></i> ${m.rating>0?m.rating.toFixed(1):'—'}</span>
              <a href="movie.html?id=${m.movieID}" class="btn-details">View Details</a>
            </div>
          </div>`).join('');
      } catch(e) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><h3>Failed to load</h3></div>'; }
    }

    async function removeFav(id, button) {
      if (button) button.disabled = true;
      try { await CineMaxFavorites.toggle(id); await loadFavs(); } catch(error) { alert(error.message); }
      finally { if (button) button.disabled = false; }
    }
    async function clearAll() {
      try { await CineMaxFavorites.clear(); await loadFavs(); } catch(error) { alert(error.message); }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('cinemax_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeIcon').className = isLight ? 'bi bi-moon' : 'bi bi-sun';
      document.getElementById('themeLabel').textContent = isLight ? 'Dark' : 'Light';
    }
    if (localStorage.getItem('cinemax_theme') === 'light') {
      document.body.classList.add('light-mode');
      document.getElementById('themeIcon').className = 'bi bi-moon';
      document.getElementById('themeLabel').textContent = 'Dark';
    }

    loadFavs();
  </script>
<script src="js/keepalive.js"></script></body>
</html>
