<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <script>if (!localStorage.getItem('cinemax_admin')) window.location.href = 'login.html';</script>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-0">
      <a class="navbar-brand" href="index.html">CINE<span>MAX</span></a>
      <div class="ms-4 d-flex align-items-center gap-2">
        <span style="background:rgba(229,9,20,0.15);color:#e50914;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;"><i class="bi bi-shield-fill me-1"></i>Admin</span>
      </div>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <a href="index.html" class="nav-link text-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Site</a>
        <button onclick="logout()" style="background:none;border:1px solid #333;border-radius:8px;padding:5px 12px;color:#999;font-size:13px;cursor:pointer;"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
      </div>
    </div>
  </nav>

  <div class="d-flex" style="min-height:calc(100vh - 65px);">
    <!-- SIDEBAR -->
    <div class="admin-sidebar">
      <div class="admin-nav-item active" onclick="showSection('dashboard')"><i class="bi bi-grid"></i>Dashboard</div>
      <div class="admin-nav-item" onclick="showSection('movies')"><i class="bi bi-film"></i>Movies</div>
      <div class="admin-nav-item" onclick="showSection('actors')"><i class="bi bi-people"></i>Actors</div>
      <div class="admin-nav-item" onclick="showSection('reviews')"><i class="bi bi-chat-square"></i>Reviews</div>
      <div class="admin-nav-item" onclick="showSection('users')"><i class="bi bi-people-fill"></i>Users</div>
      <div style="padding:20px 24px 8px;font-size:11px;color:#444;text-transform:uppercase;letter-spacing:1px;">Settings</div>
      <div class="admin-nav-item" onclick="showSection('add-movie')"><i class="bi bi-plus-circle"></i>Add Movie</div>
      <div class="admin-nav-item" onclick="showSection('add-actor')"><i class="bi bi-person-plus"></i>Add Actor</div>
    </div>

    <!-- CONTENT -->
    <div class="admin-content">

      <!-- DASHBOARD -->
      <div id="sec-dashboard">
        <div class="admin-title mb-4"><i class="bi bi-grid me-2 text-danger"></i>Dashboard</div>
        <div class="row g-3 mb-4" id="statsCards">
          <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-num text-danger" id="statMovies">—</div><div class="stat-lbl"><i class="bi bi-film me-1"></i>Total Movies</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-num" style="color:#46d369" id="statActors">—</div><div class="stat-lbl"><i class="bi bi-people me-1"></i>Actors</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-num" style="color:#f5c518" id="statReviews">—</div><div class="stat-lbl"><i class="bi bi-star me-1"></i>Reviews</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-num" style="color:#818cf8" id="statGenres">—</div><div class="stat-lbl"><i class="bi bi-tags me-1"></i>Genres</div></div></div>
          <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-num" style="color:#38bdf8" id="statUsers">—</div><div class="stat-lbl"><i class="bi bi-people-fill me-1"></i>Users</div></div></div>
        </div>
        <div class="table-dark-custom p-4">
          <h6 style="font-weight:700;margin-bottom:16px;">Recent Movies</h6>
          <div id="recentMovies"><div class="spinner mx-auto"></div></div>
        </div>
      </div>

      <!-- USERS -->
      <div id="sec-users" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="admin-title"><i class="bi bi-people-fill me-2 text-danger"></i>Registered Users</div>
          <span id="usersCountBadge" style="background:rgba(56,189,248,0.15);color:#38bdf8;padding:4px 12px;border-radius:20px;font-size:13px;"></span>
        </div>
        <div class="table-dark-custom">
          <div style="padding:16px 16px 0;">
            <input type="text" id="userSearch" class="search-bar" placeholder="Search users..." style="max-width:320px;padding:10px 16px;" oninput="filterUsers(this.value)">
          </div>
          <div id="usersTable" class="p-2"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- MOVIES LIST -->
      <div id="sec-movies" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="admin-title"><i class="bi bi-film me-2 text-danger"></i>Movies</div>
          <button class="btn-red" onclick="showSection('add-movie')"><i class="bi bi-plus me-1"></i>Add Movie</button>
        </div>
        <div class="table-dark-custom">
          <div style="padding:16px 16px 0;display:flex;gap:12px;">
            <input type="text" id="movieSearch" class="search-bar" placeholder="Search movies..." style="max-width:320px;padding:10px 16px;">
          </div>
          <div id="moviesTable" class="p-2"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- ACTORS LIST -->
      <div id="sec-actors" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="admin-title"><i class="bi bi-people me-2 text-danger"></i>Actors</div>
          <button class="btn-red" onclick="showSection('add-actor')"><i class="bi bi-plus me-1"></i>Add Actor</button>
        </div>
        <div class="table-dark-custom">
          <div id="actorsTable" class="p-2"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- REVIEWS -->
      <div id="sec-reviews" style="display:none;">
        <div class="admin-title mb-4"><i class="bi bi-chat-square me-2 text-danger"></i>Reviews</div>
        <div class="table-dark-custom">
          <div id="reviewsTable" class="p-2"><div class="loading-spinner"><div class="spinner"></div></div></div>
        </div>
      </div>

      <!-- ADD MOVIE -->
      <div id="sec-add-movie" style="display:none;">
        <div class="admin-title mb-4"><i class="bi bi-plus-circle me-2 text-danger"></i><span id="movieFormTitle">Add New Movie</span></div>
        <div class="table-dark-custom p-4" style="max-width:800px;">
          <form id="movieForm">
            <input type="hidden" id="editMovieId">
            <div class="row g-3">
              <div class="col-md-8"><label class="mb-1">Title *</label><input id="mTitle" class="form-control form-control-dark" required></div>
              <div class="col-md-4"><label class="mb-1">Release Year *</label><input id="mYear" type="number" class="form-control form-control-dark" min="1900" max="2030" required></div>
              <div class="col-12"><label class="mb-1">Description *</label><textarea id="mDesc" class="form-control form-control-dark" rows="3" required></textarea></div>
              <div class="col-md-4"><label class="mb-1">Duration (min)</label><input id="mDuration" type="number" class="form-control form-control-dark"></div>
              <div class="col-md-4"><label class="mb-1">Genre *</label><select id="mGenre" class="form-control form-control-dark" required></select></div>
              <div class="col-md-4"><label class="mb-1">Director *</label><select id="mDirector" class="form-control form-control-dark" required></select></div>
              <div class="col-md-4"><label class="mb-1">Country *</label><select id="mCountry" class="form-control form-control-dark" required></select></div>
              <div class="col-md-4"><label class="mb-1">Rating (0-10)</label><input id="mRating" type="number" step="0.1" min="0" max="10" class="form-control form-control-dark"></div>
              <div class="col-md-4"><label class="mb-1">Discount %</label><input id="mDiscount" type="number" min="0" max="100" class="form-control form-control-dark" value="0"></div>
              <div class="col-md-6"><label class="mb-1">Budget ($)</label><input id="mBudget" type="number" class="form-control form-control-dark"></div>
              <div class="col-md-6"><label class="mb-1">Box Office ($)</label><input id="mBoxOffice" type="number" class="form-control form-control-dark"></div>
              <div class="col-md-4"><label class="mb-1">Language</label><input id="mLang" class="form-control form-control-dark" value="English"></div>
              <div class="col-md-4"><label class="mb-1">Age Restriction</label><select id="mAge" class="form-control form-control-dark"><option>G</option><option>PG</option><option selected>PG-13</option><option>R</option><option>NC-17</option></select></div>
              <div class="col-md-4"><label class="mb-1">Studio</label><input id="mStudio" class="form-control form-control-dark"></div>
              <div class="col-12"><label class="mb-1">Poster URL</label><input id="mPoster" class="form-control form-control-dark" placeholder="https://..."></div>
              <div class="col-md-6 d-flex align-items-center gap-3 pt-2">
                <label class="d-flex align-items-center gap-2 cursor-pointer" style="cursor:pointer;">
                  <input type="checkbox" id="mSubtitle" class="form-check-input" style="width:18px;height:18px;"> Subtitles Available
                </label>
                <label class="d-flex align-items-center gap-2" style="cursor:pointer;">
                  <input type="checkbox" id="m3D" class="form-check-input" style="width:18px;height:18px;"> 3D
                </label>
              </div>
              <div class="col-12 d-flex gap-3 pt-2">
                <button type="submit" class="btn-red px-5 py-2"><i class="bi bi-check-lg me-2"></i>Save Movie</button>
                <button type="button" class="btn-outline-red px-4 py-2" onclick="showSection('movies')">Cancel</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- ADD ACTOR -->
      <div id="sec-add-actor" style="display:none;">
        <div class="admin-title mb-4"><i class="bi bi-person-plus me-2 text-danger"></i>Add New Actor</div>
        <div class="table-dark-custom p-4" style="max-width:600px;">
          <form id="actorForm">
            <div class="row g-3">
              <div class="col-md-8"><label class="mb-1">Full Name *</label><input id="aName" class="form-control form-control-dark" required></div>
              <div class="col-md-4"><label class="mb-1">Age *</label><input id="aAge" type="number" class="form-control form-control-dark" required></div>
              <div class="col-md-6"><label class="mb-1">Gender</label><select id="aGender" class="form-control form-control-dark"><option>Male</option><option>Female</option></select></div>
              <div class="col-md-6"><label class="mb-1">Country *</label><select id="aCountry" class="form-control form-control-dark" required></select></div>
              <div class="col-md-6"><label class="mb-1">Oscar Awards</label><input id="aOscar" type="number" min="0" class="form-control form-control-dark" value="0"></div>
              <div class="col-md-6"><label class="mb-1">Salary per Film ($)</label><input id="aSalary" type="number" class="form-control form-control-dark"></div>
              <div class="col-12"><label class="mb-1">Photo URL</label><input id="aPhoto" class="form-control form-control-dark" placeholder="https://..."></div>
              <div class="col-12 d-flex gap-3 pt-2">
                <button type="submit" class="btn-red px-5 py-2"><i class="bi bi-check-lg me-2"></i>Save Actor</button>
                <button type="button" class="btn-outline-red px-4 py-2" onclick="showSection('actors')">Cancel</button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- CONFIRM MODAL -->
  <div class="modal fade modal-dark" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Confirm Delete</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="confirmMsg">Are you sure?</div>
        <div class="modal-footer"><button class="btn-outline-red" data-bs-dismiss="modal">Cancel</button><button class="btn-red" id="confirmBtn">Delete</button></div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    let genres = [], directors = [], countries = [], confirmAction = null;
    const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));

    function showSection(name) {
      document.querySelectorAll('[id^="sec-"]').forEach(s => s.style.display = 'none');
      document.getElementById(`sec-${name}`).style.display = '';
      document.querySelectorAll('.admin-nav-item').forEach(i => i.classList.remove('active'));
      event.currentTarget?.classList.add('active');
      if (name === 'movies') loadMoviesTable();
      if (name === 'actors') loadActorsTable();
      if (name === 'reviews') loadReviewsTable();
      if (name === 'users') loadUsersTable();
      if (name === 'dashboard') loadDashboard();
    }

    async function loadMeta() {
      [genres, directors, countries] = await Promise.all([api.get('/genres'), api.get('/directors'), api.get('/countries')]);
      const fillSelect = (id, items, valKey, textKey) => {
        const el = document.getElementById(id);
        if (!el) return;
        items.forEach(i => el.innerHTML += `<option value="${i[valKey]}">${i[textKey]}</option>`);
      };
      fillSelect('mGenre', genres, 'genreID', 'genreName');
      fillSelect('mDirector', directors, 'directorID', 'fullName');
      fillSelect('mCountry', countries, 'countryID', 'countryName');
      fillSelect('aCountry', countries, 'countryID', 'countryName');
    }

    async function loadDashboard() {
      try {
        const [mv, ac, rv, gn, us] = await Promise.all([
          api.getWithHeaders('/movies?pageSize=5'), api.get('/actors'), api.get('/reviews'), api.get('/genres'), api.get('/auth/users')
        ]);
        document.getElementById('statMovies').textContent = mv.total;
        document.getElementById('statActors').textContent = ac.length;
        document.getElementById('statReviews').textContent = rv.length;
        document.getElementById('statGenres').textContent = gn.length;
        document.getElementById('statUsers').textContent = us.length;
        document.getElementById('recentMovies').innerHTML = `
          <table class="w-100"><thead><tr><th>Title</th><th>Year</th><th>Genre</th><th>Rating</th><th>Actions</th></tr></thead>
          <tbody>${mv.data.map(m => `
            <tr>
              <td><strong>${m.title}</strong></td>
              <td>${m.releaseYear}</td>
              <td><span class="movie-genre">${m.genreName}</span></td>
              <td><span class="movie-rating"><i class="bi bi-star-fill"></i> ${m.rating.toFixed(1)}</span></td>
              <td><a href="movie.html?id=${m.movieID}" class="btn-icon me-1" title="View"><i class="bi bi-eye"></i></a></td>
            </tr>`).join('')}</tbody></table>`;
      } catch (e) {}
    }

    async function loadMoviesTable() {
      document.getElementById('moviesTable').innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
      try {
        const search = document.getElementById('movieSearch')?.value || '';
        const { data: movies } = await api.getWithHeaders(`/movies?pageSize=50${search ? '&search=' + search : ''}`);
        document.getElementById('moviesTable').innerHTML = `
          <table class="w-100"><thead><tr><th>Poster</th><th>Title</th><th>Year</th><th>Genre</th><th>Rating</th><th>Discount</th><th>Actions</th></tr></thead>
          <tbody>${movies.map(m => `
            <tr>
              <td><img src="${m.posterUrl||''}" style="width:36px;height:52px;object-fit:cover;border-radius:4px;background:#222;" onerror="this.style.display='none'"></td>
              <td><strong style="color:#fff;">${m.title}</strong><br><span style="font-size:11px;color:#555;">${m.directorName}</span></td>
              <td>${m.releaseYear}</td>
              <td><span class="movie-genre">${m.genreName}</span></td>
              <td><span class="movie-rating"><i class="bi bi-star-fill"></i> ${m.rating.toFixed(1)}</span></td>
              <td>${m.discountPercent > 0 ? `<span style="color:#46d369;font-weight:700;">-${m.discountPercent}%</span>` : '<span style="color:#444;">—</span>'}</td>
              <td>
                <a href="movie.html?id=${m.movieID}" class="btn-icon me-1" title="View"><i class="bi bi-eye"></i></a>
                <button class="btn-icon me-1" onclick="editMovie(${m.movieID})" title="Edit"><i class="bi bi-pencil"></i></button>
                <button class="btn-icon danger" onclick="deleteMovie(${m.movieID},'${m.title.replace(/'/g,"\\'")}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`).join('')}</tbody></table>`;
      } catch (e) {
        document.getElementById('moviesTable').innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h3>Failed to load</h3></div>';
      }
    }

    async function loadActorsTable() {
      try {
        const actors = await api.get('/actors');
        document.getElementById('actorsTable').innerHTML = `
          <table class="w-100"><thead><tr><th>Photo</th><th>Name</th><th>Age</th><th>Gender</th><th>Country</th><th>Oscars</th><th>Actions</th></tr></thead>
          <tbody>${actors.map(a => `
            <tr>
              <td>${a.photoUrl ? `<img src="${a.photoUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:50%;background:#222;" onerror="this.style.display='none'">` : '<div style="width:36px;height:36px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">🎭</div>'}</td>
              <td><strong style="color:#fff;">${a.fullName}</strong></td>
              <td>${a.age}</td>
              <td>${a.gender}</td>
              <td>${a.countryName}</td>
              <td>${a.oscarAwards > 0 ? `<span style="color:#f5c518;">🏆 ${a.oscarAwards}</span>` : '—'}</td>
              <td>
                <button class="btn-icon danger" onclick="deleteActor(${a.actorID},'${a.fullName.replace(/'/g,"\\'")}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`).join('')}</tbody></table>`;
      } catch (e) {}
    }

    async function loadReviewsTable() {
      try {
        const reviews = await api.get('/reviews');
        document.getElementById('reviewsTable').innerHTML = `
          <table class="w-100"><thead><tr><th>User</th><th>Comment</th><th>Rating</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody>${reviews.map(r => `
            <tr>
              <td><strong style="color:#fff;">${r.username}</strong></td>
              <td style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.commentText}</td>
              <td><span class="movie-rating"><i class="bi bi-star-fill"></i> ${r.userRating.toFixed(1)}</span></td>
              <td style="white-space:nowrap;">${formatDate(r.reviewDate)}</td>
              <td><button class="btn-icon danger" onclick="deleteReview(${r.reviewID})"><i class="bi bi-trash"></i></button></td>
            </tr>`).join('')}</tbody></table>`;
      } catch (e) {}
    }

    async function editMovie(id) {
      try {
        const m = await api.get(`/movies/${id}`);
        document.getElementById('movieFormTitle').textContent = 'Edit Movie';
        document.getElementById('editMovieId').value = id;
        document.getElementById('mTitle').value = m.title;
        document.getElementById('mYear').value = m.releaseYear;
        document.getElementById('mDesc').value = m.description;
        document.getElementById('mDuration').value = m.durationMinutes;
        document.getElementById('mRating').value = m.rating;
        document.getElementById('mDiscount').value = m.discountPercent;
        document.getElementById('mBudget').value = m.budget;
        document.getElementById('mBoxOffice').value = m.boxOffice;
        document.getElementById('mLang').value = m.languageName;
        document.getElementById('mStudio').value = m.productionCompany;
        document.getElementById('mPoster').value = m.posterUrl;
        document.getElementById('mSubtitle').checked = m.subtitleAvailable;
        document.getElementById('m3D').checked = m.is3D;
        showSection('add-movie');
      } catch (e) { showToast('Failed to load movie', 'error'); }
    }

    function deleteMovie(id, title) {
      document.getElementById('confirmMsg').textContent = `Delete "${title}"?`;
      confirmAction = async () => { await api.delete(`/movies/${id}`); showToast('Movie deleted'); loadMoviesTable(); };
      confirmModal.show();
    }
    function deleteActor(id, name) {
      document.getElementById('confirmMsg').textContent = `Delete actor "${name}"?`;
      confirmAction = async () => { await api.delete(`/actors/${id}`); showToast('Actor deleted'); loadActorsTable(); };
      confirmModal.show();
    }
    function deleteReview(id) {
      document.getElementById('confirmMsg').textContent = 'Delete this review?';
      confirmAction = async () => { await api.delete(`/reviews/${id}`); showToast('Review deleted'); loadReviewsTable(); };
      confirmModal.show();
    }

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      if (confirmAction) { try { await confirmAction(); } catch (e) { showToast('Action failed', 'error'); } confirmAction = null; }
      confirmModal.hide();
    });

    document.getElementById('movieForm').addEventListener('submit', async e => {
      e.preventDefault();
      const editId = document.getElementById('editMovieId').value;
      const body = {
        title: document.getElementById('mTitle').value,
        description: document.getElementById('mDesc').value,
        releaseYear: parseInt(document.getElementById('mYear').value),
        durationMinutes: parseInt(document.getElementById('mDuration').value) || 0,
        genreID: parseInt(document.getElementById('mGenre').value),
        directorID: parseInt(document.getElementById('mDirector').value),
        countryID: parseInt(document.getElementById('mCountry').value),
        rating: parseFloat(document.getElementById('mRating').value) || 0,
        discountPercent: parseInt(document.getElementById('mDiscount').value) || 0,
        budget: parseFloat(document.getElementById('mBudget').value) || 0,
        boxOffice: parseFloat(document.getElementById('mBoxOffice').value) || 0,
        languageName: document.getElementById('mLang').value,
        ageRestriction: document.getElementById('mAge').value,
        productionCompany: document.getElementById('mStudio').value,
        posterUrl: document.getElementById('mPoster').value,
        subtitleAvailable: document.getElementById('mSubtitle').checked,
        is3D: document.getElementById('m3D').checked
      };
      try {
        if (editId) { await api.put(`/movies/${editId}`, body); showToast('Movie updated!'); }
        else { await api.post('/movies', body); showToast('Movie added!'); }
        document.getElementById('editMovieId').value = '';
        document.getElementById('movieFormTitle').textContent = 'Add New Movie';
        e.target.reset();
        showSection('movies');
      } catch (ex) { showToast('Failed to save', 'error'); }
    });

    document.getElementById('actorForm').addEventListener('submit', async e => {
      e.preventDefault();
      const body = {
        fullName: document.getElementById('aName').value,
        age: parseInt(document.getElementById('aAge').value),
        gender: document.getElementById('aGender').value,
        countryID: parseInt(document.getElementById('aCountry').value),
        oscarAwards: parseInt(document.getElementById('aOscar').value) || 0,
        salary: parseFloat(document.getElementById('aSalary').value) || 0,
        photoUrl: document.getElementById('aPhoto').value
      };
      try {
        await api.post('/actors', body);
        showToast('Actor added!');
        e.target.reset();
        showSection('actors');
      } catch (ex) { showToast('Failed to save', 'error'); }
    });

    document.getElementById('movieSearch')?.addEventListener('input', () => { clearTimeout(window._st); window._st = setTimeout(loadMoviesTable, 400); });

    let allUsers = [];
    async function loadUsersTable() {
      try {
        allUsers = await api.get('/auth/users');
        document.getElementById('usersCountBadge').textContent = `${allUsers.length} total users`;
        document.getElementById('statUsers').textContent = allUsers.length;
        renderUsersTable(allUsers);
      } catch(e) {
        document.getElementById('usersTable').innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h3>Failed to load users</h3></div>';
      }
    }
    function filterUsers(q) {
      const filtered = allUsers.filter(u => u.username.toLowerCase().includes(q.toLowerCase()) || u.email.toLowerCase().includes(q.toLowerCase()));
      renderUsersTable(filtered);
    }
    function renderUsersTable(users) {
      if (!users.length) {
        document.getElementById('usersTable').innerHTML = '<div class="empty-state" style="padding:40px"><i class="bi bi-people"></i><h3>No users found</h3></div>';
        return;
      }
      document.getElementById('usersTable').innerHTML = `
        <table class="table table-dark table-hover mb-0" style="font-size:14px;">
          <thead><tr>
            <th style="color:#666;font-weight:600;padding:16px;">ID</th>
            <th style="color:#666;font-weight:600;">User</th>
            <th style="color:#666;font-weight:600;">Email</th>
            <th style="color:#666;font-weight:600;">Reviews</th>
            <th style="color:#666;font-weight:600;">Joined</th>
            <th style="color:#666;font-weight:600;">Actions</th>
          </tr></thead>
          <tbody>${users.map(u => `
            <tr>
              <td style="padding:14px;color:#555;">#${u.userID}</td>
              <td><div style="display:flex;align-items:center;gap:10px;">
                <div style="width:32px;height:32px;border-radius:50%;background:#e50914;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;">${(u.username||'U')[0].toUpperCase()}</div>
                <span style="font-weight:600;color:#fff;">${u.username}</span>
              </div></td>
              <td style="color:#888;">${u.email}</td>
              <td><span style="background:rgba(245,197,24,0.15);color:#f5c518;padding:2px 8px;border-radius:4px;font-size:12px;">${u.reviewCount} reviews</span></td>
              <td style="color:#555;font-size:12px;">${formatDate(u.registrationDate)}</td>
              <td><button onclick="deleteUser(${u.userID},'${u.username}')" style="background:rgba(229,9,20,0.15);border:none;color:#e50914;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;"><i class="bi bi-trash"></i></button></td>
            </tr>`).join('')}
          </tbody>
        </table>`;
    }
    function deleteUser(id, name) {
      document.getElementById('confirmMsg').textContent = `Delete user "${name}" and all their reviews?`;
      confirmAction = async () => { await api.delete(`/auth/users/${id}`); showToast('User deleted'); loadUsersTable(); };
      confirmModal.show();
    }

    loadMeta();
    loadDashboard();

    function logout() { localStorage.removeItem('cinemax_admin'); window.location.href = 'login.html'; }
  </script>
<script src="js/keepalive.js"></script></body>
</html>
