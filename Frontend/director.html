<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director — CineMax</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid px-0">
      <a class="navbar-brand" href="index.html">CINE<span>MAX</span></a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-4 me-auto gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="actors.html"><i class="bi bi-people me-1"></i>Actors</a></li>
          <li class="nav-item"><a class="nav-link" href="reviews.html"><i class="bi bi-chat-square-text me-1"></i>Reviews</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div style="padding:16px 24px;"><a href="javascript:history.back()" style="color:var(--text-muted);font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;"><i class="bi bi-arrow-left"></i> Back</a></div>

  <div id="directorDetail" class="movies-section">
    <div style="display:flex;gap:24px;flex-wrap:wrap;">
      <div class="skeleton" style="width:180px;height:180px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;min-width:200px;">
        <div class="skeleton skeleton-line" style="width:50%;height:28px;margin:0 0 16px 0;"></div>
        <div class="skeleton skeleton-line medium"></div>
        <div class="skeleton skeleton-line short"></div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (!id) window.location.href = '404.html';

    async function load() {
      try {
        const [directors, allMovies] = await Promise.all([
          api.get('/directors'),
          api.getWithHeaders('/movies?page=1&pageSize=50&sortBy=rating').then(r => r.data)
        ]);
        const d = directors.find(x => x.directorID == id);
        if (!d) { window.location.href = '404.html'; return; }

        const films = allMovies.filter(m => m.directorName === d.fullName);
        document.title = `${d.fullName} — CineMax`;

        document.getElementById('directorDetail').innerHTML = `
          <div class="d-flex gap-4 flex-wrap align-items-center mb-5">
            <div style="width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#e50914,#b20710);display:flex;align-items:center;justify-content:center;font-size:56px;flex-shrink:0;">🎬</div>
            <div>
              <h1 style="font-size:clamp(24px,4vw,40px);font-weight:900;">${d.fullName}</h1>
              <div class="d-flex gap-3 flex-wrap mt-2">
                <span class="stat-box px-3 py-2"><i class="bi bi-camera-reels me-1 text-danger"></i>${d.experienceYears} yrs exp</span>
                <span class="stat-box px-3 py-2"><i class="bi bi-trophy me-1 text-warning"></i>${d.awardsCount} awards</span>
                <span class="stat-box px-3 py-2"><i class="bi bi-film me-1" style="color:#818cf8;"></i>${films.length} films</span>
              </div>
            </div>
          </div>

          ${films.length ? `
          <h2 class="section-title mb-4">Filmography</h2>
          <div class="movies-grid">
            ${films.map(m => `
              <div class="movie-card" onclick="window.location='movie.html?id=${m.movieID}'" style="cursor:pointer;">
                ${m.posterUrl ? `<img class="movie-poster" src="${m.posterUrl}" alt="${m.title}" loading="lazy">` : '<div class="movie-poster-placeholder">🎬</div>'}
                <div class="movie-info">
                  <div class="movie-title">${m.title}</div>
                  <div class="movie-meta"><span class="movie-year">${m.releaseYear}</span><span class="movie-genre">${m.genreName}</span></div>
                  <span class="movie-rating"><i class="bi bi-star-fill"></i> ${m.rating.toFixed(1)}</span>
                </div>
              </div>`).join('')}
          </div>` : '<div class="empty-state"><i class="bi bi-film"></i><h3>No films found</h3></div>'}
        `;
      } catch(e) { document.getElementById('directorDetail').innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h3>Failed to load</h3></div>'; }
    }

    if (localStorage.getItem('cinemax_theme') === 'light') document.body.classList.add('light-mode');
    load();
  </script>
<script src="js/keepalive.js"></script></body>
</html>
